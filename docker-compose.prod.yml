services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduai}
      POSTGRES_DB: ${POSTGRES_DB:-eduai}
    ports:
      - '${PUERTO_POSTGRES:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-eduai} -d ${POSTGRES_DB:-eduai}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod
      network: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: '0.0.0.0'
      PORT: '3000'
      SKIP_ENV_VALIDATION: '1'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai}@postgres:5432/${POSTGRES_DB:-eduai}?schema=public
      PGUSER: ${POSTGRES_USER:-eduai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-eduai}
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: ${POSTGRES_DB:-eduai}
      PGSSL: 'false'
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-ship7-a8c70.firebasestorage.app}
      UPLOAD_DRIVER: ${UPLOAD_DRIVER:-firebase}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
    ports:
      - '${PUERTO_FRONTEND:-3000}:3000'
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"require('http').get('http://127.0.0.1:3000/api/healthcheck', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  app-network:
    driver: bridge
